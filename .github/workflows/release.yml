name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release the version in package.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version in package.json is not x.y.z: $version"
            exit 1
          fi
          tags="$(git ls-remote --tags origin "refs/tags/v$version")"
          if [ -n "$tags" ]; then
            echo "Version $version is already released. Raise the version in package.json first."
            exit 1
          fi
          git archive --format=zip --prefix=t3code-rtl-fix/ --output=t3code-rtl-fix.zip HEAD
          gh release create "v$version" t3code-rtl-fix.zip windows/install.ps1 macos/install.sh \
            --target "$GITHUB_SHA" --title "$version" --generate-notes
