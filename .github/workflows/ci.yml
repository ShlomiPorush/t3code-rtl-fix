name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Test Windows PowerShell 5.1 installer
        shell: powershell
        run: .\tests\windows-powershell-compatibility.ps1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw windows/install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw windows/uninstall.ps1))
      - name: Check macOS script syntax
        shell: bash
        run: bash -n macos/install.sh && bash -n macos/uninstall.sh
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test macOS installer and update
        run: bash tests/macos-installer.sh
